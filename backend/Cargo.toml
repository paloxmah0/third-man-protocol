[package]
name = "third-man-backend"
version = "0.1.0"
edition = "2021"
description = "Third Man Protocol backend — Cardano wallet escrow: DID/KYC, agreements, OTP invites, CIP-8/CIP-30 signing, Plutus escrow, dispute/arbiter/oracle, points governance, immutable ledger mirror."
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "macros", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
async-trait = "0.1"
ciborium = "0.2"
blake2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
pallas = "0.30"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
